#
# GitHub only reads workflows from a repository's root `.github/`, so while bean2gain lives inside
# a larger repo this file is inert. It is here so that extracting the project into a repository of
# its own brings its pipeline with it, already answering the question that matters: does the
# converter still agree with beancount?
#
# The point of the job order below: the two oracle suites are the only things standing behind that
# agreement, and both skip cleanly when their prerequisites are absent. A pipeline that lets them
# skip reports green for a run that verified almost nothing — so this one installs what they need
# and then refuses the opt-outs.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # The oracle. Pinned to the version the WASM wheel was built from: comparing against a
      # different beancount would produce a wall of differences that say nothing about the runtime,
      # and the specs would skip rather than mislead — which is worse here, because skipping is
      # exactly what this pipeline exists to prevent.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m venv .venv && .venv/bin/pip install beancount==3.2.0

      - run: pnpm install --frozen-lockfile

      # Assembles public/pyodide/ (one network fetch for the dependency wheels) and compiles.
      - run: pnpm run build

      - run: pnpm run type-check

      # Both halves: the bridge protocol, the browser module against the oracle, and dump.py under
      # Node-Pyodide against the oracle. BEAN_PYTHON is set explicitly rather than relying on the
      # probe, so a missing venv fails here instead of quietly disabling the comparison.
      - name: Test
        env:
          BEAN_PYTHON: .venv/bin/python
        run: pnpm run test:unit

      # The broadest case, and the one no checked-in fixture covers: ~2000 entries of generated
      # ledger, dumped by both runtimes and compared byte for byte.
      - name: Differential harness over a generated corpus
        env:
          BEAN_PYTHON: .venv/bin/python
        run: |
          pnpm run verify:example
          pnpm run verify:fixtures
          node verify/compare.ts verify/__tests__/fixtures/generated/example.beancount
