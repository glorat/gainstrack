allowBuilds:
  '@firebase/util': true
  protobufjs: true
  unrs-resolver: true

# Security overrides: transitive deps whose parents pin a vulnerable range.
overrides:
  # GHSA-w5hq-g745-h8pq — uuid <11.1.1 missing buffer bounds check.
  # Reached via cloudevents / gaxios / gcp-metadata, all of which still ask for uuid 8.x/9.x.
  uuid: '^11.1.1'
