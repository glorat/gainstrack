# Security overrides: transitive deps whose parents still allow a vulnerable range.
# Each one must name the advisory it closes, so it can be retired once the parent
# catches up — a pin with no stated reason is how the last set went two months stale.
overrides:
  # GHSA-g7r4-m6w7-qqqr — esbuild <0.28.1 lets any site read arbitrary files off the
  # dev server. vite 8 already asks for ^0.28.1; only @quasar/app-vite caps at ^0.27.4,
  # so the shared resolution loses without this. Retire when app-vite widens its range.
  esbuild: '^0.28.1'

allowBuilds:
  '@firebase/util': true
  '@parcel/watcher': true
  browser-tabs-lock: true
  core-js: true
  esbuild: true
  protobufjs: true
