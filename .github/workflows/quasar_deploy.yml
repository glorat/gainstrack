name: Release branch CICD

on:
  push:
    branches: [ master ]

jobs:
  pre_check:
    name: Test and semver
    runs-on: ubuntu-latest
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
    defaults:
      run:
        working-directory: ./client
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.6.0
      - name: Set up Node (24)
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'pnpm'
          cache-dependency-path: client/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm test:unit:ci
      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          semantic_version: 23.1.0
          dry_run: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Version check
        if: ${{ steps.semantic.outputs.new_release_published == 'true' }}
        run: echo "Preparing version ${{ steps.semantic.outputs.new_release_version }}"
      - name: Release notes version check
        # semantic-release owns the version line; client/public/md/releases.md is the curated
        # user-facing account of it. The two drifted apart once already — the notes invented a
        # v1.x/v2.x line that was never released, and re-used v3.0.0-v3.2.0 while the tags were
        # at v3.15.0. So the top heading must name a version that really exists: either the one
        # being released now, or an earlier tag (a patch release nobody wrote notes for). A
        # version that is neither is fiction, and fails the build.
        if: ${{ steps.semantic.outputs.new_release_published == 'true' }}
        run: |
          NOTES=$(grep -m1 -oE '^### v[0-9]+\.[0-9]+\.[0-9]+' public/md/releases.md | sed 's/^### v//')
          NEXT="${{ steps.semantic.outputs.new_release_version }}"
          if [ "${NEXT##*.}" != "0" ]; then
            echo "v$NEXT is a patch release; release notes are not required."
          elif [ "$NOTES" = "$NEXT" ]; then
            echo "releases.md is headed v$NOTES — notes written for this release."
          else
            echo "::error::v$NEXT is a feature release but releases.md is headed v$NOTES. Add a '### v$NEXT' section to client/public/md/releases.md."
            exit 1
          fi
  build:
    name: Build front-end
    needs: [ pre_check ]
    if: needs.pre_check.outputs.new_release_published == 'true'
    outputs:
      new_release_published: ${{ needs.pre_check.outputs.new_release_published }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.6.0
      - name: Set up Node (24)
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'pnpm'
          cache-dependency-path: client/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
         semantic_version: 19.0.5
        env:
         GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Set package.json version
        run: pnpm version ${{ steps.semantic.outputs.new_release_version }} --no-git-tag-version
      - name: Build
        run: pnpm exec quasar build --publish sentry
      - name: Determine version
        run: echo "SOURCE_VERSION=$(jq -r .version package.json)" >> $GITHUB_ENV
      - name: Determine version
        run: echo "Deploying version $SOURCE_VERSION"
      - name: Create Sentry release
        uses: getsentry/action-release@v1
        env:
         SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
         SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
         SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
         # SENTRY_URL: https://sentry.io/
        with:
         environment: production
         sourcemaps: ./client/dist/spa
         finalize: false
         ignore_missing: true
         ignore_empty: true
         version: gainstrack@${{ env.SOURCE_VERSION }}
      - name: Remove Source Maps
        run: |
          # Remove all source maps
          find ./dist/spa -regextype posix-extended -regex '.*.(js|css).map$' -type f -delete
          # Remove source map references in files
          sed -i 's/^\/\/# sourceMappingURL=.*$//' $(find ./dist/spa -regextype posix-extended -regex '.*.(js|css)$' -type f)
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: "./client/dist/spa"
  deploy_client:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [ build ]
    if: needs.build.outputs.new_release_published == 'true'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: "./client/dist/spa"
      - name: Deploy poc
        uses: FirebaseExtended/action-hosting-deploy@v0.9.0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_GAINSTRACK }}'
          projectId: gainstrack
          target: poc
          channelId: live
          entryPoint: ./client
      - name: Deploy prod
        uses: FirebaseExtended/action-hosting-deploy@v0.9.0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_GAINSTRACK }}'
          projectId: gainstrack
          target: prod
          channelId: live
          entryPoint: ./client
  publish_cli:
    name: Publish CLI to npm
    runs-on: ubuntu-latest
    # Depends on `build` so the git tag and GitHub release exist before the npm version does —
    # an npm release with no corresponding tag would be unreproducible.
    needs: [ pre_check, build ]
    if: needs.pre_check.outputs.new_release_published == 'true'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.6.0
      - name: Set up Node (24)
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'
      - name: Install client dependencies
        # The CLI bundles the engine out of client/src and shares the client's single
        # @js-joda/core copy — see tools/gainstrack-cli/README.md. Both must be on disk to build.
        run: pnpm install --frozen-lockfile
        working-directory: ./client
      - name: Install CLI dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./tools/gainstrack-cli
      - name: Test
        run: pnpm run test:unit
        working-directory: ./tools/gainstrack-cli
      - name: Stamp version
        run: npm version ${{ needs.pre_check.outputs.new_release_version }} --no-git-tag-version
        working-directory: ./tools/gainstrack-cli
      - name: Publish
        # `prepack` runs the esbuild bundle; the tarball is dist/cli.cjs, LICENSE and README alone.
        run: npm publish
        working-directory: ./tools/gainstrack-cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
  release_backend:
    name: Build and test backend
    runs-on: ubuntu-latest
    needs: [ pre_check ]
    if: needs.pre_check.outputs.new_release_published == 'true'
    env:
      IMAGE_NAME: gcr.io/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GCP_APP_NAME }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: Configure Docker
        run: gcloud auth configure-docker --quiet

      - name: Build Docker image
        run: docker build . --file fast.Dockerfile -t $IMAGE_NAME

      - name: Push Docker image
        run: docker push $IMAGE_NAME
  deploy_backend:
    name: Deploy backend
    runs-on: ubuntu-latest
    needs: [ release_backend ]
    strategy:
      matrix:
        server: [ "quotes", "appserver" ]
    steps:
    - id: 'auth'
      uses: 'google-github-actions/auth@v2'
      with:
        credentials_json: '${{ secrets.GCP_CREDENTIALS }}'
    - name: 'Set up Cloud SDK'
      uses: 'google-github-actions/setup-gcloud@v2'
    - name: Release ${{ matrix.server }} server
      run: |-
        gcloud run deploy ${{ matrix.server }} \
          --region asia-northeast1 \
          --image gcr.io/gainstrack/gainstrack \
          --platform managed \
          --allow-unauthenticated \
          --project gainstrack
